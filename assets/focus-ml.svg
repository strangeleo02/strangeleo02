<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190" role="img" aria-label="Machine Learning &amp; AI">
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
    <stop offset="60%" stop-color="#6366F1" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.35"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.88" cy="0.1" r="0.75">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="acc" x1="0" x2="1">
    <stop offset="0%" stop-color="#8B5CF6"/>
    <stop offset="100%" stop-color="#38BDF8"/>
  </linearGradient>
  <clipPath id="c"><rect width="400" height="190" rx="16"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="400" height="190" fill="#09090F"/>
  <rect width="400" height="190" fill="url(#glow)"/>

  <!-- Number label -->
  <rect x="24" y="22" width="30" height="21" rx="5" fill="#110E2B" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="39" y="36.5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" font-weight="600" fill="#A78BFA">01</text>

  <!-- Neural network icon -->
  <g transform="translate(310, 17)" opacity="0.9">
    <line x1="10" y1="9"  x2="33" y2="5"  stroke="#8B5CF6" stroke-width="0.85" opacity="0.4"/>
    <line x1="10" y1="9"  x2="33" y2="17" stroke="#8B5CF6" stroke-width="0.85" opacity="0.4"/>
    <line x1="10" y1="9"  x2="33" y2="29" stroke="#8B5CF6" stroke-width="0.85" opacity="0.4"/>
    <line x1="10" y1="25" x2="33" y2="5"  stroke="#8B5CF6" stroke-width="0.85" opacity="0.4"/>
    <line x1="10" y1="25" x2="33" y2="17" stroke="#8B5CF6" stroke-width="0.85" opacity="0.4"/>
    <line x1="10" y1="25" x2="33" y2="29" stroke="#8B5CF6" stroke-width="0.85" opacity="0.4"/>
    <line x1="33" y1="5"  x2="56" y2="17" stroke="#6366F1" stroke-width="0.85" opacity="0.5"/>
    <line x1="33" y1="17" x2="56" y2="17" stroke="#6366F1" stroke-width="0.85" opacity="0.5"/>
    <line x1="33" y1="29" x2="56" y2="17" stroke="#6366F1" stroke-width="0.85" opacity="0.5"/>
    <circle cx="10" cy="9"  r="4.5" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-width="1.2"/>
    <circle cx="10" cy="25" r="4.5" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-width="1.2"/>
    <circle cx="33" cy="5"  r="4.5" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-width="1.2"/>
    <circle cx="33" cy="17" r="4.5" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-width="1.2"/>
    <circle cx="33" cy="29" r="4.5" fill="#6366F1" fill-opacity="0.12" stroke="#6366F1" stroke-width="1.2"/>
    <circle cx="56" cy="17" r="6"   fill="#38BDF8" fill-opacity="0.18" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="56" cy="17" r="2.5" fill="#38BDF8"/>
  </g>

  <!-- Title -->
  <text x="24" y="82" font-family="Inter,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#F1F5F9">Machine Learning &amp; AI</text>

  <!-- Description -->
  <text x="24" y="108" font-family="Inter,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#475569">LLM agent workflows, vector retrieval pipelines,</text>
  <text x="24" y="125" font-family="Inter,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#475569">and neural forecasting architectures.</text>

  <!-- Stack chips -->
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="9.5" font-weight="500">
    <rect x="24"  y="144" width="60"  height="19" rx="4" fill="#8B5CF6" fill-opacity="0.09" stroke="#8B5CF6" stroke-opacity="0.28" stroke-width="1"/>
    <text x="54"  y="157.5" text-anchor="middle" fill="#A78BFA">PyTorch</text>

    <rect x="90"  y="144" width="50"  height="19" rx="4" fill="#8B5CF6" fill-opacity="0.09" stroke="#8B5CF6" stroke-opacity="0.28" stroke-width="1"/>
    <text x="115" y="157.5" text-anchor="middle" fill="#A78BFA">Qdrant</text>

    <rect x="146" y="144" width="72"  height="19" rx="4" fill="#8B5CF6" fill-opacity="0.09" stroke="#8B5CF6" stroke-opacity="0.28" stroke-width="1"/>
    <text x="182" y="157.5" text-anchor="middle" fill="#A78BFA">LangChain</text>

    <rect x="224" y="144" width="86"  height="19" rx="4" fill="#8B5CF6" fill-opacity="0.09" stroke="#8B5CF6" stroke-opacity="0.28" stroke-width="1"/>
    <text x="267" y="157.5" text-anchor="middle" fill="#A78BFA">HuggingFace</text>
  </g>

  <!-- Accent bar -->
  <rect x="24" y="175" width="42" height="2" rx="1" fill="url(#acc)"/>
</g>
<rect x="0.75" y="0.75" width="398.5" height="188.5" rx="16" fill="none" stroke="url(#border)" stroke-width="1.5"/>
</svg>