<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190" role="img" aria-label="Backend Systems &amp; APIs">
<defs>
  <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
  </linearGradient>

  <radialGradient id="glow-be" cx="0.85" cy="0.15" r="0.7">
    <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="pill-acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#6366F1"/>
    <stop offset="100%" stop-color="#38BDF8"/>
  </linearGradient>

  <clipPath id="card-clip">
    <rect width="400" height="190" rx="16"/>
  </clipPath>
</defs>

<style>
  .server-light { animation: sBlink 2.2s ease-in-out infinite; }
  @keyframes sBlink { 0%, 100% { fill: #10B981; } 50% { fill: #38BDF8; } }
</style>

<g clip-path="url(#card-clip)">
  <!-- Background -->
  <rect width="400" height="190" fill="#0D1117"/>
  <rect width="400" height="190" fill="url(#glow-be)"/>

  <!-- Top Left Number Pill -->
  <rect x="24" y="22" width="38" height="24" rx="6" fill="#151733" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1"/>
  <text x="43" y="38" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#818CF8">02</text>

  <!-- Top Right Server / Database Stack Icon Graphic (Replaced soundwave) -->
  <g transform="translate(325, 20)">
    <!-- Microservice Stack -->
    <rect x="6" y="6" width="36" height="10" rx="3" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2"/>
    <circle cx="12" cy="11" r="1.5" class="server-light"/>
    <line x1="18" y1="11" x2="36" y2="11" stroke="#6366F1" stroke-width="1" stroke-opacity="0.5"/>

    <rect x="6" y="20" width="36" height="10" rx="3" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2"/>
    <circle cx="12" cy="25" r="1.5" fill="#38BDF8"/>
    <line x1="18" y1="25" x2="36" y2="25" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>

    <rect x="6" y="34" width="36" height="10" rx="3" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.2"/>
    <circle cx="12" cy="39" r="1.5" fill="#A78BFA"/>
    <line x1="18" y1="39" x2="36" y2="39" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Data flow path -->
    <path d="M 24 0 L 24 6 M 24 16 L 24 20 M 24 30 L 24 34" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.6"/>
  </g>

  <!-- Content -->
  <text x="24" y="88" font-family="Inter,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Backend Systems &amp; APIs</text>
  <text x="24" y="118" font-family="Inter,-apple-system,sans-serif" font-size="13.5" fill="#94A3B8">High-throughput async FastAPI services,</text>
  <text x="24" y="139" font-family="Inter,-apple-system,sans-serif" font-size="13.5" fill="#94A3B8">PostgreSQL, Redis, &amp; multi-tenant RBAC.</text>

  <!-- Bottom Accent Bar -->
  <rect x="24" y="162" width="48" height="3" rx="1.5" fill="url(#pill-acc)"/>
</g>

<!-- Card Border -->
<rect x="0.75" y="0.75" width="398.5" height="188.5" rx="16" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>
</svg>