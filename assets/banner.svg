<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Amal Jerry">
<defs>

  <!-- Deep background -->
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#06070D"/>
    <stop offset="100%" stop-color="#0A0D1A"/>
  </linearGradient>

  <!-- Split ambient lighting — the hero effect -->
  <radialGradient id="left-light" cx="0" cy="0.5" r="0.7" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
    <stop offset="60%" stop-color="#6D28D9" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="right-light" cx="1" cy="0.5" r="0.7" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0891B2" stop-opacity="0.38"/>
    <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
  </radialGradient>

  <!-- Subtle top center bloom behind name -->
  <radialGradient id="name-bloom" cx="0.5" cy="0.5" r="0.4" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#4338CA" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
  </radialGradient>

  <!-- Name text gradient -->
  <linearGradient id="name-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="70%" stop-color="#F0EBFF"/>
    <stop offset="100%" stop-color="#C4B5FD"/>
  </linearGradient>

  <!-- Divider lines -->
  <linearGradient id="rule-grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
    <stop offset="30%" stop-color="#7C3AED" stop-opacity="0.6"/>
    <stop offset="50%" stop-color="#6366F1" stop-opacity="0.8"/>
    <stop offset="70%" stop-color="#0891B2" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
  </linearGradient>

  <!-- Dot texture -->
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#FFFFFF" fill-opacity="0.035"/>
  </pattern>

  <clipPath id="clip">
    <rect width="1200" height="300" rx="20"/>
  </clipPath>

  <!-- Name soft glow filter -->
  <filter id="name-glow" x="-20%" y="-60%" width="140%" height="220%">
    <feGaussianBlur stdDeviation="22" result="blur"/>
    <feComposite in="blur" in2="SourceGraphic" operator="over"/>
  </filter>

  <!-- Outer border gradient -->
  <linearGradient id="border-grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
    <stop offset="40%" stop-color="#4338CA" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#0891B2" stop-opacity="0.45"/>
  </linearGradient>

</defs>

<style>
  .rule { animation: ruleShimmer 4s ease-in-out infinite alternate; }
  @keyframes ruleShimmer { from { opacity: 0.5; } to { opacity: 1; } }
</style>

<g clip-path="url(#clip)">

  <!-- Background layers -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <rect width="1200" height="300" fill="url(#left-light)"/>
  <rect width="1200" height="300" fill="url(#right-light)"/>
  <rect width="1200" height="300" fill="url(#name-bloom)"/>

  <!-- Top horizontal rule -->
  <rect class="rule" x="100" y="48" width="1000" height="1" fill="url(#rule-grad)" rx="0.5"/>

  <!-- Eyebrow: handle label -->
  <text x="600" y="38"
    text-anchor="middle"
    font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
    font-size="10" font-weight="500" letter-spacing="7"
    fill="#4B5563">STRANGELEO02</text>

  <!-- Name — glow layer -->
  <text x="600" y="172"
    text-anchor="middle"
    font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="92" font-weight="800" letter-spacing="-3"
    fill="#8B5CF6" opacity="0.2"
    filter="url(#name-glow)">Amal Jerry</text>

  <!-- Name — main -->
  <text x="600" y="172"
    text-anchor="middle"
    font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="92" font-weight="800" letter-spacing="-3"
    fill="url(#name-grad)">Amal Jerry</text>

  <!-- Role descriptor — ultra clean -->
  <text x="600" y="210"
    text-anchor="middle"
    font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
    font-size="14" font-weight="400" letter-spacing="2.5"
    fill="#475569">AI ENGINEER  ·  BACKEND SYSTEMS  ·  SPATIAL AUDIO</text>

  <!-- Bottom rule -->
  <rect class="rule" x="100" y="245" width="1000" height="1" fill="url(#rule-grad)" rx="0.5"/>

  <!-- Three tag chips — clean, borderline minimal -->
  <g font-family="Inter,-apple-system,sans-serif" font-size="11.5" font-weight="500">

    <!-- Tag 1 -->
    <g transform="translate(222, 262)">
      <rect x="0" y="0" width="204" height="26" rx="4"
        fill="#7C3AED" fill-opacity="0.08"
        stroke="#7C3AED" stroke-opacity="0.22" stroke-width="1"/>
      <text x="102" y="17.5" text-anchor="middle"
        letter-spacing="1" fill="#A78BFA">LLM Agents  ·  Vector Ops</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(462, 262)">
      <rect x="0" y="0" width="276" height="26" rx="4"
        fill="#4338CA" fill-opacity="0.08"
        stroke="#4338CA" stroke-opacity="0.22" stroke-width="1"/>
      <text x="138" y="17.5" text-anchor="middle"
        letter-spacing="1" fill="#A5B4FC">FastAPI  ·  PostgreSQL  ·  Redis</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(774, 262)">
      <rect x="0" y="0" width="204" height="26" rx="4"
        fill="#0891B2" fill-opacity="0.08"
        stroke="#0891B2" stroke-opacity="0.22" stroke-width="1"/>
      <text x="102" y="17.5" text-anchor="middle"
        letter-spacing="1" fill="#7DD3FC">DSP  ·  Spatial Audio</text>
    </g>

  </g>

</g>

<!-- Card border -->
<rect x="0.5" y="0.5" width="1199" height="299" rx="20"
  fill="none" stroke="url(#border-grad)" stroke-width="1"/>
</svg>