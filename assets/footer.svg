<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="Let's build something extraordinary">
<defs>
  <linearGradient id="footer-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#090D16"/>
    <stop offset="50%" stop-color="#0D111E"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>

  <linearGradient id="brand-line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
    <stop offset="25%" stop-color="#8B5CF6" stop-opacity="0.8"/>
    <stop offset="50%" stop-color="#6366F1" stop-opacity="1"/>
    <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="footer-glow" cx="0.5" cy="0.4" r="0.5">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
    <stop offset="50%" stop-color="#6366F1" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
  </linearGradient>

  <clipPath id="footer-clip">
    <rect width="1200" height="130" rx="20"/>
  </clipPath>
</defs>

<style>
  .pulse-node { animation: pNode 3s ease-in-out infinite alternate; }
  @keyframes pNode { 0% { opacity: 0.4; } 100% { opacity: 1; } }
</style>

<g clip-path="url(#footer-clip)">
  <!-- Background -->
  <rect width="1200" height="130" fill="url(#footer-bg)"/>
  <rect width="1200" height="130" fill="url(#footer-glow)"/>

  <!-- Glowing Center Beam Line -->
  <line x1="200" y1="36" x2="1000" y2="36" stroke="url(#brand-line)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="600" cy="36" r="3" fill="#6366F1" class="pulse-node"/>
  <circle cx="600" cy="36" r="7" fill="#6366F1" opacity="0.25"/>

  <!-- Footer Text -->
  <text x="600" y="74" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="16" font-weight="700" letter-spacing="4.5" fill="#FFFFFF">LET&apos;S BUILD SOMETHING EXTRAORDINARY</text>
  <text x="600" y="98" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" letter-spacing="2" fill="#94A3B8">OPEN FOR HIGH-IMPACT COLLABORATIONS &amp; ROLES</text>
</g>

<!-- Card Border -->
<rect x="0.75" y="0.75" width="1198.5" height="128.5" rx="20" fill="none" stroke="url(#card-border)" stroke-width="1.2"/>
</svg>