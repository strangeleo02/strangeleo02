<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="400" height="190" role="img" aria-label="Spatial Audio &amp; DSP">
<defs>
  <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
  </linearGradient>

  <radialGradient id="glow-dsp" cx="0.85" cy="0.15" r="0.7">
    <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="pill-acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>

  <clipPath id="card-clip">
    <rect width="400" height="190" rx="16"/>
  </clipPath>
</defs>

<style>
  .radar-ring { animation: rPulse 4s ease-out infinite; transform-origin: 350px 32px; }
  @keyframes rPulse { 0% { r: 6; opacity: 0.8; } 100% { r: 24; opacity: 0; } }
</style>

<g clip-path="url(#card-clip)">
  <!-- Background -->
  <rect width="400" height="190" fill="#0D1117"/>
  <rect width="400" height="190" fill="url(#glow-dsp)"/>

  <!-- Top Left Number Pill -->
  <rect x="24" y="22" width="38" height="24" rx="6" fill="#132338" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
  <text x="43" y="38" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#38BDF8">03</text>

  <!-- Top Right Spatial Audio 3D Polar Coordinate / DSP Graphic (Replaced soundwave) -->
  <g transform="translate(320, 10)">
    <!-- Concentric Spatial Coordinate Rings -->
    <circle cx="30" cy="22" r="22" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
    <circle cx="30" cy="22" r="14" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.4"/>
    <circle cx="30" cy="22" r="7" fill="none" stroke="#8B5CF6" stroke-width="1.2" opacity="0.7"/>
    <!-- Center Spatial Source -->
    <circle cx="30" cy="22" r="3" fill="#38BDF8"/>
    <!-- 3D Spatial Vector Axes -->
    <line x1="30" y1="2" x2="30" y2="42" stroke="#38BDF8" stroke-width="0.8" opacity="0.35"/>
    <line x1="10" y1="22" x2="50" y2="22" stroke="#38BDF8" stroke-width="0.8" opacity="0.35"/>
    <!-- Sound Vector Nodes -->
    <circle cx="44" cy="14" r="2.5" fill="#C4B5FD"/>
    <circle cx="18" cy="32" r="2.5" fill="#8B5CF6"/>
  </g>

  <!-- Content -->
  <text x="24" y="88" font-family="Inter,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Spatial Audio &amp; DSP</text>
  <text x="24" y="118" font-family="Inter,-apple-system,sans-serif" font-size="13.5" fill="#94A3B8">Real-time DSP, neural stem separation,</text>
  <text x="24" y="139" font-family="Inter,-apple-system,sans-serif" font-size="13.5" fill="#94A3B8">&amp; on-device 3D audio pipelines.</text>

  <!-- Bottom Accent Bar -->
  <rect x="24" y="162" width="48" height="3" rx="1.5" fill="url(#pill-acc)"/>
</g>

<!-- Card Border -->
<rect x="0.75" y="0.75" width="398.5" height="188.5" rx="16" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>
</svg>