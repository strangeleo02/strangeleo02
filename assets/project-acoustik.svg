<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" width="560" height="190" role="img" aria-label="Acoustik: Spatial Audio Engine">
<defs>
  <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
    <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4"/>
  </linearGradient>

  <radialGradient id="card-glow" cx="0.9" cy="0.1" r="0.75">
    <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="tag-bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#172554" stop-opacity="0.8"/>
  </linearGradient>

  <clipPath id="card-clip">
    <rect width="560" height="190" rx="16"/>
  </clipPath>
</defs>

<style>
  .dot { animation: dPulse 2.4s ease-in-out infinite; }
  @keyframes dPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } }
</style>

<g clip-path="url(#card-clip)">
  <!-- Background -->
  <rect width="560" height="190" fill="#0D1117"/>
  <rect width="560" height="190" fill="url(#card-glow)"/>

  <!-- Top Left: Category Status Badge -->
  <circle class="dot" cx="32" cy="36" r="3.5" fill="#8B5CF6"/>
  <circle cx="32" cy="36" r="7" fill="#8B5CF6" opacity="0.2"/>
  <text x="46" y="40" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="600" letter-spacing="2.5" fill="#A78BFA">SPATIAL AUDIO · DSP</text>

  <!-- Top Right: Spatial Audio Engine Pill (Replaced soundwave) -->
  <g transform="translate(390, 24)">
    <rect x="0" y="0" width="144" height="26" rx="13" fill="url(#tag-bg)" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="13" r="3" fill="#A78BFA"/>
    <text x="28" y="17" font-family="'SFMono-Regular',Consolas,monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#DDD6FE">3D DSP ENGINE</text>
  </g>

  <!-- Project Title -->
  <text x="30" y="92" font-family="Inter,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Acoustik</text>

  <!-- Description -->
  <text x="30" y="124" font-family="Inter,-apple-system,sans-serif" font-size="14" fill="#94A3B8">3D binaural soundscapes rendered on-device through</text>
  <text x="30" y="145" font-family="Inter,-apple-system,sans-serif" font-size="14" fill="#94A3B8">cross-platform low-latency spatial audio DSP pipelines.</text>

  <!-- Bottom Link Prompt -->
  <text x="530" y="165" text-anchor="end" font-family="Inter,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#A78BFA">View repository  →</text>
</g>

<!-- Card Border -->
<rect x="0.75" y="0.75" width="558.5" height="188.5" rx="16" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>
</svg>